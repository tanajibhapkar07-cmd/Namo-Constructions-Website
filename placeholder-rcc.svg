<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"
     role="img" aria-label="Photo placeholder: RCC structural work">
  <title>Placeholder - RCC structural work</title>
  <defs>
    <linearGradient id="rccBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef5ff"/><stop offset="1" stop-color="#dbe7f6"/>
    </linearGradient>
    <linearGradient id="rccSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6b84"/><stop offset="1" stop-color="#33445c"/>
    </linearGradient>
    <linearGradient id="rccCol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9eff7"/><stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bccbe0"/>
    </linearGradient>
    <linearGradient id="rccGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0c05a"/><stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <pattern id="rccGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#123061" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#rccBg)"/>
  <rect width="800" height="500" fill="url(#rccGrid)"/>
  <path d="M0 410h800v90H0z" fill="#d7e4f2"/>

  <!-- cast columns -->
  <g fill="url(#rccCol)">
    <rect x="176" y="140" width="56" height="278" rx="4"/>
    <rect x="372" y="140" width="56" height="278" rx="4"/>
    <rect x="568" y="140" width="56" height="278" rx="4"/>
  </g>
  <!-- slab beams -->
  <g fill="#dbe4f0">
    <rect x="146" y="102" width="508" height="42" rx="5"/>
    <rect x="160" y="272" width="480" height="30" rx="4"/>
  </g>
  <rect x="146" y="102" width="508" height="10" rx="4" fill="#ffffff"/>

  <!-- reinforcement cage in column -->
  <g stroke="url(#rccSteel)" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M192 150v250M216 150v250M188 190h32M188 250h32M188 310h32"/>
    <path d="M388 150v250M412 150v250M384 200h32M384 264h32M384 328h32"/>
  </g>
  <!-- exposed rebar above slab -->
  <g stroke="url(#rccSteel)" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M204 102V66M248 102V66M400 102V66M444 102V66M596 102V66M640 102V66"/>
    <path d="M204 82h44M400 82h44M596 82h44" stroke-width="3"/>
  </g>
  <!-- shuttering props -->
  <g stroke="#8fa6c1" stroke-width="5" stroke-linecap="round">
    <path d="M256 302v108M544 302v108M300 302v108"/>
  </g>
  <rect x="240" y="296" width="330" height="10" rx="5" fill="#b9c9dc"/>

  <!-- measuring tape / engineering accent -->
  <g transform="translate(400,438)">
    <rect x="-118" y="-19" width="236" height="38" rx="19" fill="#ffffff" opacity="0.94" stroke="#123061" stroke-opacity="0.12"/>
    <text y="4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600"
          fill="#26364e">RCC Structure</text>
  </g>
  <rect x="700" y="82" width="86" height="34" rx="17" fill="url(#rccGold)"/>
  <text x="743" y="104" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700"
