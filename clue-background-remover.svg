<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="Clue AI Background Remover app icon placeholder">
  <title>Clue AI Background Remover - app icon placeholder</title>
  <defs>
    <linearGradient id="brBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c9cf5"/><stop offset="1" stop-color="#123061"/>
    </linearGradient>
    <linearGradient id="brGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0c05a"/><stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <pattern id="brDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#ffffff" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#brBg)"/>
  <rect width="256" height="256" rx="56" fill="url(#brDots)"/>
  <!-- subject: person cut-out -->
  <circle cx="128" cy="100" r="34" fill="#ffffff"/>
  <path d="M74 200c0-32 24-56 54-56s54 24 54 56z" fill="#ffffff"/>
  <!-- selection outline (dashed) -->
  <path d="M74 200c0-32 24-56 54-56s54 24 54 56" fill="none" stroke="url(#brGold)" stroke-width="7"
        stroke-dasharray="14 10" stroke-linecap="round"/>
  <circle cx="128" cy="100" r="34" fill="none" stroke="url(#brGold)" stroke-width="7" stroke-dasharray="14 10"
          stroke-linecap="round"/>
  <!-- magic sparkle -->
  <g fill="url(#brGold)">
    <path d="M204 44l6 18 18 6-18 6-6 18-6-18-18-6 18-6z"/>
    <path d="M52 52l4 12 12 4-12 4-4 12-4-12-12-4 12-4z" opacity="0.85"/>
  </g>
</svg>