<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620"
     role="img" aria-labelledby="devTitle devDesc">
  <title id="devTitle">Android and Flutter mobile software</title>
  <desc id="devDesc">Illustration of an Android phone and a Flutter desktop build, both running ClueTech Tecnnology applications.</desc>
  <defs>
    <linearGradient id="dBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123061"/><stop offset="1" stop-color="#050d1c"/>
    </linearGradient>
    <linearGradient id="dScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#dbe8f8"/>
    </linearGradient>
    <linearGradient id="dGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0c05a"/><stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="dBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c9cf5"/><stop offset="1" stop-color="#1663cf"/>
    </linearGradient>
    <filter id="dShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020814" flood-opacity="0.5"/>
    </filter>
    <pattern id="dGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="dPhone"><rect x="146" y="96" width="220" height="436" rx="26"/></clipPath>
    <clipPath id="dDesk"><rect x="404" y="196" width="300" height="196" rx="10"/></clipPath>
  </defs>

  <rect width="760" height="620" fill="url(#dBg)"/>
  <rect width="760" height="620" fill="url(#dGrid)"/>
  <circle cx="620" cy="120" r="150" fill="#2a7bea" opacity="0.14"/>
  <circle cx="120" cy="520" r="130" fill="#c9a227" opacity="0.1"/>

  <!-- ============ ANDROID PHONE ============ -->
  <g filter="url(#dShadow)">
    <rect x="134" y="84" width="244" height="460" rx="34" fill="#0a1c3c" stroke="#5c9cf5" stroke-opacity="0.45" stroke-width="2"/>
    <g clip-path="url(#dPhone)">
      <rect x="146" y="96" width="220" height="436" fill="url(#dScreen)"/>
      <!-- status bar -->
      <rect x="146" y="96" width="220" height="26" fill="#0c2044"/>
      <g fill="#b9d5fb">
        <rect x="160" y="106" width="26" height="5" rx="2.5"/>
        <rect x="196" y="106" width="16" height="5" rx="2.5"/>
      </g>
      <circle cx="348" cy="108" r="4" fill="#e0c05a"/>
      <!-- app header -->
      <rect x="146" y="122" width="220" height="52" fill="#ffffff"/>
      <rect x="158" y="136" width="30" height="30" rx="9" fill="url(#dBlue)"/>
      <rect x="166" y="146" width="14" height="10" rx="2" fill="#ffffff" opacity="0.9"/>
      <g fill="#26364e">
        <rect x="198" y="140" width="76" height="8" rx="4"/>
        <rect x="198" y="154" width="52" height="6" rx="3" fill="#8fa6c1"/>
      </g>
      <!-- card list -->
      <g>
        <rect x="158" y="188" width="196" height="62" rx="12" fill="#ffffff"/>
        <rect x="170" y="200" width="40" height="40" rx="11" fill="#2a7bea" opacity="0.85"/>
        <rect x="222" y="204" width="88" height="8" rx="4" fill="#26364e"/>
        <rect x="222" y="220" width="112" height="6" rx="3" fill="#a9c2dc"/>
        <rect x="158" y="260" width="196" height="62" rx="12" fill="#ffffff"/>
        <rect x="170" y="272" width="40" height="40" rx="11" fill="url(#dGold)" opacity="0.85"/>
        <rect x="222" y="276" width="96" height="8" rx="4" fill="#26364e"/>
        <rect x="222" y="292" width="100" height="6" rx="3" fill="#a9c2dc"/>
        <rect x="158" y="332" width="196" height="62" rx="12" fill="#ffffff"/>
        <rect x="170" y="344" width="40" height="40" rx="11" fill="#5c9cf5" opacity="0.8"/>
        <rect x="222" y="348" width="80" height="8" rx="4" fill="#26364e"/>
        <rect x="222" y="364" width="116" height="6" rx="3" fill="#a9c2dc"/>
      </g>
      <!-- CTA -->
      <rect x="158" y="410" width="196" height="42" rx="21" fill="#1663cf"/>
      <rect x="212" y="427" width="88" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
      <!-- bottom nav -->
      <rect x="146" y="478" width="220" height="54" fill="#ffffff"/>
      <g fill="#a9c2dc">
        <rect x="168" y="500" width="22" height="8" rx="4"/>
        <rect x="222" y="500" width="22" height="8" rx="4"/>
        <rect x="276" y="500" width="22" height="8" rx="4"/>
        <rect x="330" y="500" width="22" height="8" rx="4"/>
      </g>
    </g>
    <!-- android robot badge -->
    <g transform="translate(196,506)">
      <circle cx="0" cy="0" r="0" fill="none"/>
    </g>
    <rect x="212" y="88" width="88" height="20" rx="10" fill="#0c2044"/>
    <text x="256" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10"
          font-weight="700" letter-spacing="1.4" fill="#e0c05a">ANDROID</text>
    <!-- home indicator -->
    <rect x="206" y="524" width="100" height="6" rx="3" fill="#5c9cf5" opacity="0.6"/>
  </g>

  <!-- ============ FLUTTER DESKTOP BUILD ============ -->
  <g filter="url(#dShadow)">
    <rect x="392" y="184" width="324" height="220" rx="14" fill="#0a1c3c" stroke="#5c9cf5" stroke-opacity="0.4" stroke-width="2"/>
    <g clip-path="url(#dDesk)">
      <rect x="404" y="196" width="300" height="196" fill="#0b1e3f"/>
      <!-- flutter-style IDE -->
      <rect x="404" y="196" width="300" height="24" fill="#07152c"/>
      <g fill="#3d5a80"><circle cx="418" cy="208" r="4"/><circle cx="432" cy="208" r="4"/><circle cx="446" cy="208" r="4"/></g>
      <!-- device selector chips -->
      <g>
        <rect x="416" y="234" width="96" height="26" rx="13" fill="#1663cf"/>
        <rect x="520" y="234" width="110" height="26" rx="13" fill="#123061" stroke="#2a7bea" stroke-opacity="0.5"/>
        <rect x="638" y="234" width="56" height="26" rx="13" fill="#123061" stroke="#2a7bea" stroke-opacity="0.5"/>
        <g fill="#ffffff" opacity="0.9">
          <rect x="432" y="244" width="64" height="6" rx="3"/>
          <rect x="538" y="244" width="74" height="6" rx="3" fill-opacity="0.5"/>
          <rect x="654" y="244" width="26" height="6" rx="3" fill-opacity="0.5"/>
        </g>
      </g>
      <!-- widget tree -->
      <rect x="416" y="274" width="128" height="104" rx="10" fill="#0f2b52" stroke="#2a7bea" stroke-opacity="0.35"/>
      <g fill="#5c9cf5" opacity="0.7">
        <rect x="428" y="288" width="70" height="6" rx="3"/>
        <rect x="444" y="304" width="58" height="6" rx="3"/>
        <rect x="444" y="320" width="76" height="6" rx="3"/>
        <rect x="444" y="336" width="46" height="6" rx="3"/>
      </g>
      <!-- code canvas -->
      <rect x="556" y="274" width="138" height="104" rx="10" fill="#0f2b52" stroke="#2a7bea" stroke-opacity="0.35"/>
      <g>
        <rect x="568" y="288" width="46" height="7" rx="3.5" fill="#e0c05a" opacity="0.85"/>
        <rect x="568" y="303" width="86" height="7" rx="3.5" fill="#5c9cf5" opacity="0.6"/>
        <rect x="584" y="318" width="70" height="7" rx="3.5" fill="#b9d5fb" opacity="0.45"/>
        <rect x="584" y="333" width="96" height="7" rx="3.5" fill="#2a7bea" opacity="0.7"/>
        <rect x="568" y="348" width="58" height="7" rx="3.5" fill="#c9a227" opacity="0.6"/>
      </g>
      <rect x="568" y="361" width="106" height="2" rx="1" fill="#e0c05a" opacity="0.6"/>
    </g>
    <path d="M362 404h384l26 30a8 8 0 0 1-7 12H343a8 8 0 0 1-7-12z" fill="#123061" stroke="#5c9cf5" stroke-opacity="0.35"/>
    <rect x="506" y="414" width="96" height="9" rx="4.5" fill="#0a1c3c"/>
    <rect x="470" y="176" width="96" height="20" rx="10" fill="#0c2044"/>
    <text x="518" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10"
          font-weight="700" letter-spacing="1.4" fill="#e0c05a">FLUTTER</text>
  </g>

  <!-- flutter logo mark (simple geometric approximation) -->
  <g transform="translate(84,452) scale(1.15)" opacity="0.95">
    <path d="M22 0 8 14l7 7L36 0z" fill="#2a7bea"/>
    <path d="M22 26 8 40l7 7 21-21z" fill="#5c9cf5"/>
    <path d="M22 26 8 40l-6-6L16 20z" fill="#1663cf" opacity="0.6"/>
  </g>

  <!-- caption rules -->
  <g fill="none" stroke-linecap="round">
    <path d="M150 566h190" stroke="#2a7bea" stroke-width="3" stroke-opacity="0.5"/>
    <path d="M440 566h180" stroke="#e0c05a" stroke-width="3" stroke-opacity="0.6"/>
  </g>
  <g fill="#b9d5fb" opacity="0.45">
    <rect x="150" y="578" width="120" height="6" rx="3"/>
    <rect x="440" y="578" width="140" height="6" rx="3"/>
  </g>
</svg>